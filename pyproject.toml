[build-system]
# >=77 for PEP 639 license expressions (`license = "Apache-2.0"`).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "latefuse"
version = "0.1.0"
description = "Multi-tenant LoRA serving for encoder models via late-fusion batched matrix multiplication"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Ashutosh Dwivedi" }]
keywords = [
    "lora",
    "multi-tenant",
    "serving",
    "inference",
    "embeddings",
    "encoder",
    "transformers",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# Ranges, not pins. The exact versions every published benchmark was measured
# with live in uv.lock (`uv sync --locked`); pinning them here instead would
# make the library uninstallable alongside almost any other torch project.
dependencies = [
    "torch>=2.2",
    "transformers>=4.39,<5.0",
    "numpy>=1.26",
    "safetensors>=0.4",
]

[project.urls]
Homepage = "https://github.com/ashutoshrdwivedi/LateFuse"
Repository = "https://github.com/ashutoshrdwivedi/LateFuse"
Issues = "https://github.com/ashutoshrdwivedi/LateFuse/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "peft>=0.11",
]
# Required to run the accuracy benchmarks (benchmarks/quality/setfit_compare.py).
quality = [
    "setfit>=1.1.0",
    "datasets>=2.14",
    "scikit-learn>=1.3",
    "typer>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
latefuse = ["py.typed"]

# CUDA torch on Linux (GPU serving hosts); regular PyPI torch (CPU/MPS)
# everywhere else. Development-only: [tool.uv] is not wheel metadata, so an
# installer other than uv never sees this index.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_checkpoints: equivalence checks against the multi-GB generality-row checkpoints (needs CUDA; deselect with -m 'not real_checkpoints')",
]

[tool.ruff.lint]
select = ["E", "F", "UP", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[dependency-groups]
# The versions the paper's PEFT comparison was measured against. Pinned here,
# where reproduction matters, rather than in [project.dependencies], where it
# would constrain every downstream install.
dev = [
    "peft==0.19.1",
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
]
