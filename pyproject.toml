[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-serving"
version = "0.1.0"
description = "LateFuse: multi-tenant LoRA serving for encoder models via late-fusion batched matrix multiplication"
requires-python = ">=3.10"
dependencies = [
    "torch==2.11.0",
    "transformers==4.57.6",
    "accelerate>=0.26",
    "numpy>=1.26",
    "pydantic>=2.0",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
]
# Required to run the accuracy benchmarks (benchmarks/quality/setfit_compare.py).
quality = [
    "setfit>=1.1.0",
    "datasets>=2.14",
    "scikit-learn>=1.3",
    "typer>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]

# CUDA torch on Linux (GPU serving hosts); regular PyPI torch (CPU/MPS)
# everywhere else.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "UP", "I"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "peft==0.19.1",
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
]