apiVersion: v1
kind: ConfigMap
metadata:
  name: lora-serving-config
  namespace: lora-serving
  labels:
    app.kubernetes.io/name: lora-serving
data:
  # --- Model ---
  LORA_MODEL_NAME: "intfloat/multilingual-e5-small"
  LORA_LORA_RANK: "8"
  LORA_MAX_SEQ_LEN: "512"
  LORA_TARGET_MODULES: '["query", "value"]'
  LORA_NUM_LABELS: "10"

  # --- Batching ---
  LORA_MAX_BATCH_SIZE: "32"
  LORA_BATCH_TIMEOUT_MS: "10.0"

  # --- Device ---
  LORA_DEVICE: "cuda:0"
  LORA_DTYPE: "float32"

  # --- Adapter storage (DigitalOcean Spaces) ---
  LORA_S3_ENDPOINT_URL: "https://nyc3.digitaloceanspaces.com"
  LORA_S3_BUCKET: "lora-adapters"
  LORA_S3_REGION: "nyc3"
  LORA_ADAPTER_LOCAL_DIR: "/tmp/adapters"

  # --- Redis ---
  LORA_REDIS_URL: "redis://redis.lora-serving.svc.cluster.local:6379/0"
  LORA_REDIS_CHANNEL: "lora:adapter_updates"

  # --- Preload (comma-separated adapter IDs to load at startup) ---
  LORA_PRELOAD_ADAPTER_IDS: '[]'
---
# S3 credentials stored in a Secret (not ConfigMap)
apiVersion: v1
kind: Secret
metadata:
  name: lora-serving-s3-creds
  namespace: lora-serving
  labels:
    app.kubernetes.io/name: lora-serving
type: Opaque
stringData:
  LORA_S3_ACCESS_KEY: "YOUR_DO_SPACES_ACCESS_KEY"
  LORA_S3_SECRET_KEY: "YOUR_DO_SPACES_SECRET_KEY"
